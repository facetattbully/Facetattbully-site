<!DOCTYPE html>
<html>
<head>
<title>ENTER</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
}

a {
  font-family: 'Orbitron', monospace;
  font-size: 36px;
  letter-spacing: 8px;
  color: #ff2bd6;
  text-decoration: none;
  border: 1px solid #ff2bd6;
  padding: 18px 50px;
  text-shadow: 0 0 12px #ff2bd6;
  box-shadow: 0 0 18px #ff2bd6;
}
</style>
</head>

<body>

<audio id="darkAudio">
  <source src="dark.mp3" type="audio/mpeg">
</audio>

<a href="#" onclick="enterSite()">ENTER</a>

<script>
function enterSite() {
  const audio = document.getElementById("darkAudio");
  audio.volume = 0;
  audio.play();

  let v = 0;
  const fade = setInterval(() => {
    if (v < 0.7) {
      v += 0.05;
      audio.volume = v;
    } else {
      clearInterval(fade);
    }
  }, 80);

  setTimeout(() => {
    window.location.href = "home.html";
  }, 900);
}
</script>

</body>
</html>
